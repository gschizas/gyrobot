<style>
    .user-status { display: block; font-size: 0.85rem; margin-top: 0.15rem; }
    .user-status.ok { color: #1a7f37; }
    .user-status.not_found { color: #cf222e; }
    .user-status.invalid { color: #bc4c00; }
    .user-status.already_onboarded { color: #8250df; }
    .user-status.error { color: #9a6700; }
    .user-status.pending { color: #57606a; }
    .user-status.compact { display: inline; margin: 0; font-size: 1.1rem; cursor: help; }
    .status-cell { width: 2rem; text-align: center; padding-left: 0; padding-right: 0; }
</style>
<script>
// Server-side GitHub username validation: the usernames are POSTed to a backend
// route, which checks them against GitHub. Use attachGithubUserValidation(form, url[, beforeSubmit]).
//
// Statuses returned by the server:
//   ok         - the account exists
//   invalid    - not a well-formed GitHub username (e.g. an email or an @mention); GitHub was not asked
//   not_found  - well-formed, but GitHub has no such account
//   already_onboarded - the account exists and our database already has a live GitHub provision for it
//   error      - the lookup itself failed (e.g. rate limit); says nothing about the username
function attachGithubUserValidation(form, url, beforeSubmit) {
    const SELECTOR = 'input[name="username"]';
    const VALIDATE_TIMEOUT_MS = 20000; // a hung lookup must not leave Submit looking dead
    const ICONS = { ok: '✔ ', invalid: '⛔ ', not_found: '✖ ', already_onboarded: '🚫 ', error: '⚠ ' };
    const state = new WeakMap(); // input -> {value, status}

    // Rows with a .status-cell get a compact icon there (text in the tooltip); otherwise the full
    // text goes right under the input.
    function statusHost(input) {
        const row = input.closest('tr');
        return (row && row.querySelector('.status-cell')) || input.parentElement;
    }

    function marker(input) {
        const host = statusHost(input);
        let span = host.querySelector(':scope > .user-status');
        if (!span) {
            span = document.createElement('span');
            span.className = 'user-status';
            if (host === input.parentElement) input.insertAdjacentElement('afterend', span);
            else host.appendChild(span);
        }
        return span;
    }

    function show(input, status, text) {
        const span = marker(input);
        const compact = statusHost(input) !== input.parentElement;
        span.className = 'user-status ' + status + (compact ? ' compact' : '');
        const label = status === 'pending' ? 'Checking...' : ICONS[status] + text;
        span.textContent = compact ? (status === 'pending' ? '⏳' : ICONS[status].trim()) : label;
        span.title = label;
    }

    function clear(input) {
        const span = statusHost(input).querySelector(':scope > .user-status');
        if (span) span.remove();
        state.delete(input);
    }

    async function validate(inputs) {
        const targets = inputs.filter(function (input) {
            const value = input.value.trim();
            if (!value) { clear(input); return false; }
            const known = state.get(input);
            return !(known && known.value === value && known.status !== 'error');
        });
        if (!targets.length) return;
        targets.forEach(function (input) { show(input, 'pending'); });

        let results = {};
        const controller = new AbortController();
        const timer = setTimeout(function () { controller.abort(); }, VALIDATE_TIMEOUT_MS);
        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ usernames: targets.map(function (i) { return i.value.trim(); }) }),
                signal: controller.signal,
            });
            if (!response.ok) throw new Error((await response.json()).error || response.statusText);
            results = (await response.json()).results;
        } catch (err) {
            const reason = err.name === 'AbortError' ? 'timed out' : err.message;
            targets.forEach(function (input) { show(input, 'error', 'Could not check: ' + reason); });
            return;
        } finally {
            clearTimeout(timer);
        }
        targets.forEach(function (input) {
            const value = input.value.trim();
            const result = results[value];
            if (!result) { clear(input); return; }
            state.set(input, { value: value, status: result.status });
            let text = result.message;
            if (result.status === 'ok') {
                text = result.login && result.login !== value ? 'Exists (' + result.login + ')' : 'Exists';
            }
            show(input, result.status, text);
        });
    }

    // 'change' fires on blur/Enter (not per keystroke), and also for each programmatic edit made by the
    // bulk paste handler; queue them so a paste of N rows results in one request, not N.
    let queued = new Set();
    let timer = null;
    form.addEventListener('change', function (event) {
        if (!event.target.matches(SELECTOR)) return;
        queued.add(event.target);
        clearTimeout(timer);
        timer = setTimeout(function () {
            const batch = Array.from(queued);
            queued = new Set();
            validate(batch);
        }, 300);
    });
    form.addEventListener('input', function (event) {
        if (event.target.matches(SELECTOR)) clear(event.target);
    });

    // Validates all usernames, with the submit button showing progress meanwhile.
    async function validateWithFeedback(inputs) {
        const button = form.querySelector('button[type="submit"]');
        const label = button ? button.textContent : '';
        if (button) { button.disabled = true; button.textContent = 'Checking usernames...'; }
        try {
            await validate(inputs);
        } finally {
            if (button) { button.disabled = false; button.textContent = label; }
        }
    }

    // Returns the inputs known to be wrong and a message; lookup errors (rate limit) never count,
    // because the backend validates again on submit.
    function findProblems(inputs) {
        const MESSAGES = {
            invalid: ' invalid username(s) (wrong format).',
            not_found: ' username(s) not found on GitHub.',
            already_onboarded: ' user(s) already onboarded.',
        };
        const bad = [];
        const lines = [];
        Object.keys(MESSAGES).forEach(function (status) {
            const matching = inputs.filter(function (input) {
                const known = state.get(input);
                return known && known.status === status;
            });
            if (matching.length) { bad.push(matching[0]); lines.push(matching.length + MESSAGES[status]); }
        });
        return { first: bad[0], message: lines.join('\n') };
    }

    // Submission is cancelled, validated asynchronously, then done natively with submit(), which does not
    // fire 'submit' again (re-firing it with requestSubmit() after an await was unreliable). beforeSubmit is an
    // optional synchronous page-specific check (return false to stop); it runs after the browser's own validation.
    form.addEventListener('submit', async function (event) {
        event.preventDefault();
        const inputs = Array.from(form.querySelectorAll(SELECTOR));
        await validateWithFeedback(inputs);
        const problems = findProblems(inputs);
        if (problems.first) {
            problems.first.focus();
            alert(problems.message + '\nPlease fix them and resubmit.');
            return;
        }
        if (!form.reportValidity()) return;
        if (beforeSubmit && beforeSubmit() === false) return;
        HTMLFormElement.prototype.submit.call(form);
    });
}
</script>
