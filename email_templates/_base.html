<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{bot_name}} Notification{% endblock %}</title>
    <style>
        body { margin: 0; padding: 0; background-color: #f0f2f5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    </style>
</head>
<body style="margin:0;padding:0;background-color:#f0f2f5;">
    <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f0f2f5;padding:32px 0;">
        <tr>
            <td align="center">
                <table width="600" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;width:100%;">
                    <!-- Header -->
                    <tr>
                        <td style="background-color:#1e3a5f;border-radius:8px 8px 0 0;padding:28px 32px;text-align:center;">
                            <p style="color:#ffffff;font-size:22px;font-weight:700;margin:0;letter-spacing:0.5px;">🤖 {{bot_name}}</p>
                            <p style="color:#a8c4e0;font-size:13px;margin:6px 0 0;">{% block heading %}Automated Notification{% endblock %}</p>
                        </td>
                    </tr>
                    <!-- Content card -->
                    <tr>
                        <td style="background-color:#ffffff;padding:36px 40px;border-left:1px solid #dde3ec;border-right:1px solid #dde3ec;">
                            {% block content %}{% endblock %}
                        </td>
                    </tr>
                    <!-- Footer -->
                    <tr>
                        <td style="background-color:#e8ecf1;border-radius:0 0 8px 8px;padding:16px 32px;text-align:center;border:1px solid #dde3ec;border-top:none;">
                            <p style="color:#888;font-size:12px;margin:0;">This is an automated message from {{bot_name}}. Please do not reply.</p>
                            {% block footer_extra %}{% endblock %}
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
